
experiment:
  name: aodma_sampler_performance_v1
  seed: 42
  deterministic: false

benchmark:
  warmup_trials: 1
  repetitions: 5
  batch_size: 16
  save_samples: true

  output_dir: results/benchmarks

  candidates:
    - name: ddpm_1000
      sampler: ddpm

    - name: ddim_10
      sampler: ddim
      steps: 10
      eta: 0.0

    - name: ddim_20
      sampler: ddim
      steps: 20
      eta: 0.0

    - name: ddim_50
      sampler: ddim
      steps: 50
      eta: 0.0

    - name: ddim_100
      sampler: ddim
      steps: 100
      eta: 0.0

statistics:
  confidence_level: 0.95
  bootstrap_iterations: 5000
